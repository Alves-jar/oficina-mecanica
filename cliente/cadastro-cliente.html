<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do Cliente | Oficina Central</title>
  <link rel="stylesheet" href="../login/login.css">
  <link rel="stylesheet" href="cadastro-cliente.css">
  <script src="../compartilhado/dados-iniciais.js" defer></script>
  <script src="../compartilhado/banco.js" defer></script>
  <script src="cadastro-cliente.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="cadastro-title">
      <header class="login-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 5h6v6H5zm8 0h6v4h-6zM5 13h6v6H5zm8 4h6v2h-6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow">Oficina Central</p>
        <h1 id="cadastro-title">Cadastro do cliente</h1>
        <p class="subtitle">Crie sua conta para acompanhar o status do seu veículo.</p>
      </header>

      <form id="cadastro-form" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome completo" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" autocomplete="tel">
        </div>

        <div class="field">
          <label for="senha">Crie sua senha</label>
          <div class="password-wrap">
            <input id="senha" name="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="cta" id="cadastrar-button">Cadastrar e entrar</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <footer class="login-footer">
        <a href="../login/login.html" class="footer-link">Voltar para o login</a>
      </footer>
    </section>
  </main>
</body>
</html>
