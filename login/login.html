<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10171d">
  <title>Login | Oficina Central</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>

<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 5h6v6H5zm8 0h6v4h-6zM5 13h6v6H5zm8 4h6v2h-6z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow">Oficina Central</p>
        <h1 id="login-title">Acesso administrativo</h1>
        <p class="subtitle">Informe seu nome, e-mail e senha para entrar.</p>
      </header>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome completo" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="tipo-acesso">Tipo de acesso</label>
          <select id="tipo-acesso" name="tipo-acesso">
            <option value="admin">Administrador</option>
            <option value="cliente">Cliente</option>
          </select>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Manter conectado</span>
          </label>
          <a href="#" id="forgot-password">Esqueci a senha</a>
        </div>

        <button type="submit" class="cta" id="login-button">Entrar</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="register-trigger">
        <a href="../cliente/cadastro-cliente.html" class="link-button">Quero me cadastrar como cliente</a>
      </div>

      <footer class="login-footer">
        Acesso exclusivo para administradores da oficina.
      </footer>
    </section>
  </main>
</body>
</html>
